<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festi Noël — Administration</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      --green-900: #06281f; --green-800: #0b3d2e; --green-700: #14513e;
      --red: #b23a2c; --gold: #e8b94a; --gold-dark: #c99a2c;
      --cream: #fbf8f1; --white: #ffffff; --ink: #1a221e; --muted: #626b66;
      --line: rgba(11,61,46,0.12); --radius: 4px; --radius-sm: 2px;
      --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--cream); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    [hidden] { display: none !important; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    img { max-width: 100%; display: block; }
    h1, h2 { font-family: var(--serif); font-weight: 700; letter-spacing: -0.01em; }
    .container { width: min(1180px, calc(100% - 40px)); margin-inline: auto; }
    .admin-header { background: var(--green-800); color: var(--cream); border-bottom: 1px solid var(--green-700); }
    .admin-header-inner { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 1rem; color: var(--cream); }
    .brand-mark { width: 26px; height: 26px; border-radius: var(--radius-sm); display: grid; place-items: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: var(--gold); }
    .brand-divider { width: 1px; height: 16px; background: rgba(255,255,255,0.2); margin: 0 4px; }
    .brand-sub { font-family: var(--sans); font-size: 0.78rem; color: rgba(255,255,255,0.6); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
    .btn-primary, .btn-secondary, .btn-ghost, .btn-danger { border: 0; border-radius: var(--radius); padding: 9px 14px; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s ease; }
    .btn-primary { background: var(--green-800); color: var(--white); }
    .btn-primary:hover { background: var(--green-700); }
    .btn-ghost { background: transparent; color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.22); }
    .icon-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--white); color: var(--green-800); display: grid; place-items: center; padding: 0; }
    .icon-btn:hover { background: #efe9df; }
    #loginView { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(400px, 100%); background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px; }
    .login-card h1 { margin: 0 0 6px; color: var(--green-800); font-size: 1.5rem; }
    .login-card p { margin: 0 0 22px; color: var(--muted); font-size: 0.88rem; }
    .login-card label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--green-800); margin-bottom: 6px; }
    .login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--cream); outline: none; font-family: var(--mono); font-size: 0.88rem; margin-bottom: 14px; }
    .login-card .btn-primary { width: 100%; }
    #dashboardView { padding: 32px 0 64px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 32px; }
    .stat-card { background: var(--white); padding: 18px 20px; }
    .stat-card .label { font-size: 0.72rem; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    .stat-card .value { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; color: var(--green-800); line-height: 1.1; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
    .tab { background: transparent; border: 0; padding: 10px 16px; font-size: 0.88rem; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .tab.active { color: var(--green-800); border-bottom-color: var(--green-800); font-weight: 600; }
    .tab-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .data-table { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-size: 0.85rem; }
    .data-table thead th { text-align: left; padding: 10px 14px; background: #f6f2e9; border-bottom: 1px solid var(--line); font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .data-table tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .data-table .mono { font-family: var(--mono); font-size: 0.8rem; color: var(--green-800); font-weight: 600; }
    .data-table .muted { color: var(--muted); font-size: 0.8rem; }
    .data-table .right { text-align: right; }
    .data-table select.status-select { padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--white); font-size: 0.8rem; }
    .expand-toggle { background: transparent; border: 0; padding: 2px 6px; color: var(--green-800); font-size: 0.75rem; font-weight: 600; text-decoration: underline; }
    #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 8px; overflow: hidden; border: 2px solid var(--green-800); }
    .scan-result-box { text-align: center; margin-top: 20px; padding: 20px; border-radius: var(--radius); font-weight: bold; font-size: 1.1rem; }
    .scan-success { background: #e6f0eb; color: #1c7a52; border: 1px solid #1c7a52; }
    .scan-error { background: #fdf2f2; color: var(--red); border: 1px solid var(--red); }
    .toast { position: fixed; z-index: 200; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--green-900); color: var(--white); border-radius: var(--radius); padding: 10px 16px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: 0.2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 820px) { .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="container admin-header-inner">
      <a class="brand" href="/"><span class="brand-mark">✦</span><span>Festi Noël</span><span class="brand-divider"></span><span class="brand-sub">Admin</span></a>
      <div id="sessionArea" hidden><button id="logoutBtn" class="btn-ghost">Déconnexion</button></div>
    </div>
  </header>

  <main id="loginView">
    <div class="login-card">
      <h1>Administration</h1>
      <p>Entrez votre jeton d'accès sécurisé.</p>
      <form id="loginForm">
        <label for="token">Jeton</label>
        <input id="token" type="password" required />
        <button type="submit" class="btn-primary">Se connecter</button>
        <p id="loginError" style="color:var(--red);font-size:0.8rem;margin-top:10px;" hidden></p>
      </form>
    </div>
  </main>

  <main id="dashboardView" hidden>
    <section class="container stats-grid" id="statsGrid"></section>
    
    <div class="container">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="orders">Commandes</button>
        <button type="button" class="tab" data-tab="scanner">Scanner QR (Accès)</button>
      </div>
    </div>

    <section class="container" id="ordersTab">
      <div class="tab-toolbar">
        <span class="muted" style="font-size:.82rem" id="ordersCount"></span>
      </div>
      <table class="data-table">
        <thead><tr><th>Code</th><th>Client</th><th>Date</th><th class="right">Billets</th><th class="right">Total</th><th>Statut</th><th></th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </section>

    <section class="container" id="scannerTab" hidden>
      <div class="tab-toolbar">
        <h2 style="font-size: 1.2rem; color: var(--green-800);">Scannez le QR Code du client</h2>
      </div>
      <div id="reader"></div>
      <div id="scanResultBox" class="scan-result-box" hidden></div>
      <p style="text-align:center; color:var(--muted); font-size:0.85rem; margin-top:15px;">Placez le QR code du client devant la caméra pour valider son accès.</p>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    const TOKEN_KEY = 'festi-admin-token';
    let token = sessionStorage.getItem(TOKEN_KEY) || '';
    let allOrders = [];
    let html5QrCode;
    const $ = (id) => document.getElementById(id);
    
    const money = (v) => new Intl.NumberFormat('fr-FR').format(v) + ' FRS';
    const dateFmt = (d) => new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(d));
    
    function authHeaders() { return { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }; }
    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
      if (res.status === 401) { logout(); throw new Error('Session expirée'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || 'Erreur');
      return data;
    }
    function showToast(msg) { $('toast').textContent = msg; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 2500); }

    async function login(entered) {
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: entered }) });
      if (!res.ok) throw new Error('Jeton incorrect');
      token = entered; sessionStorage.setItem(TOKEN_KEY, token); showDashboard();
    }
    function logout() { token = ''; sessionStorage.removeItem(TOKEN_KEY); showLogin(); }
    function showLogin() { $('loginView').hidden = false; $('dashboardView').hidden = true; $('sessionArea').hidden = true; }
    function showDashboard() { $('loginView').hidden = true; $('dashboardView').hidden = false; $('sessionArea').hidden = false; refreshAll(); }

    async function refreshAll() { try { await Promise.all([loadStats(), loadOrders()]); } catch (err) { showToast(err.message); } }
    
    async function loadStats() {
      const s = await api('/api/admin/stats');
      $('statsGrid').innerHTML = `
        <div class="stat-card"><div class="label">Revenu</div><div class="value">${money(s.revenue)}</div></div>
        <div class="stat-card"><div class="label">Billets vendus</div><div class="value">${s.ticketsSold}</div></div>
        <div class="stat-card"><div class="label">Commandes</div><div class="value">${s.orderCount}</div></div>
        <div class="stat-card"><div class="label">Événement</div><div class="value">12 Déc.</div></div>`;
    }

    async function loadOrders() {
      const data = await api('/api/admin/orders');
      allOrders = data.orders; $('ordersCount').textContent = `${data.total} commandes`;
      
      $('ordersBody').innerHTML = allOrders.map(o => `
        <tr>
          <td><span class="mono">${o.orderCode}</span></td>
          <td>${o.customer.name}<br><small>${o.customer.phone}</small></td>
          <td>${dateFmt(o.createdAt)}</td>
          <td class="right">${o.items.reduce((s, i) => s + i.quantity, 0)}</td>
          <td class="right">${money(o.total)}</td>
          <td>
            <select class="status-select" data-order-status="${o._id}">
              <option value="confirmed" ${o.status === 'confirmed' ? 'selected' : ''}>Confirmée (Payé)</option>
              <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>En attente</option>
              <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Annulée</option>
            </select>
          </td>
          <td style="white-space: nowrap;">
            <button class="expand-toggle" onclick="alert('${o.items.map(i => `${i.quantity}x ${i.ticketId?.name}`).join('\\n')}')">Détails</button>
            <button class="icon-btn" style="color:var(--red); border-color: rgba(178,58,44,0.3); margin-left: 5px;" onclick="deleteOrder('${o._id}')" title="Supprimer">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
            </button>
          </td>
        </tr>`).join('');
    }

    window.deleteOrder = async function(id) {
      if (!confirm("Voulez-vous vraiment supprimer cette transaction ? Cette action est irréversible.")) return;
      try {
        await api(`/api/admin/orders/${id}`, { method: 'DELETE' });
        showToast('Transaction supprimée');
        loadOrders();
        loadStats();
      } catch (err) {
        showToast(err.message || 'Erreur lors de la suppression');
      }
    }

    $('ordersBody').addEventListener('change', async (e) => {
      const sel = e.target.closest('[data-order-status]');
      if (!sel) return;
      try { 
        await api(`/api/admin/orders/${sel.dataset.orderStatus}/status`, { 
          method: 'PATCH', 
          body: JSON.stringify({ status: sel.value }) 
        }); 
        showToast('Statut mis à jour avec succès'); 
        loadStats(); 
        loadOrders(); 
      } catch (err) { 
        showToast(err.message || 'Erreur lors de la mise à jour'); 
      }
    });

    function startScanner() {
      if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }
      html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        (errorMessage) => { }
      ).catch(err => { showToast("Erreur caméra : " + err); });
    }

    function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => { html5QrCode.clear(); }).catch(() => {});
      }
    }

    async function onScanSuccess(decodedText) {
      html5QrCode.pause(true);
      const box = $('scanResultBox');
      box.hidden = false;
      box.className = 'scan-result-box';
      box.textContent = "Vérification du billet...";
      box.style.color = 'var(--muted)';

      try {
        const res = await api('/api/admin/scan', { method: 'POST', body: JSON.stringify({ orderCode: decodedText }) });
        box.className = 'scan-result-box scan-success';
        box.innerHTML = `✅ ACCÈS AUTORISÉ<br><span style="font-size:0.9rem">${res.customer}</span>`;
        showToast('Accès validé');
      } catch (err) {
        box.className = 'scan-result-box scan-error';
        box.innerHTML = `❌ ACCÈS REFUSÉ<br><span style="font-size:0.9rem">${err.message}</span>`;
      }
      
      setTimeout(() => { box.hidden = true; if (html5QrCode) html5QrCode.resume(); }, 3000);
    }

    $('loginForm').addEventListener('submit', async (e) => { 
      e.preventDefault(); $('loginError').hidden = true;
      try { await login($('token').value.trim()); } catch (err) { $('loginError').textContent = err.message; $('loginError').hidden = false; } 
    });
    $('logoutBtn').addEventListener('click', logout);
    
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        $('ordersTab').hidden = target !== 'orders';
        $('scannerTab').hidden = target !== 'scanner';

        if (target === 'scanner') startScanner();
        else stopScanner();
      });
    });

    if (token) showDashboard(); else showLogin();
  </script>
</body>
</html>
